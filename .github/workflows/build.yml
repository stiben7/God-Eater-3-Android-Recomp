name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-33" > /dev/null
      - name: Third-party sources
        run: bash tools/setup.sh
      - name: Runtime compute shaders
        run: bash tools/shaders.sh
      - name: FFmpeg cache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg-android
          key: ffmpeg-android-${{ hashFiles('tools/build_ffmpeg.sh') }}
      - name: FFmpeg (video fallback)
        run: bash tools/build_ffmpeg.sh
      - name: Build APK
        run: bash tools/build_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ge3recomp
          path: build/mhriseport.apk
          if-no-files-found: error
