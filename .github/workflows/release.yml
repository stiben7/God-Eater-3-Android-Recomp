name: release

# Pushing a tag vX.Y.Z builds the optimized APK (tools/build_apk.sh RELEASE=1), signs it with the project's release key
# (repository secrets RELEASE_KEYSTORE_B64 and RELEASE_KS_PASS, key alias recomp) and attaches it to the GitHub release
# of that tag (created if missing). Two more APKs go with it, the same app under a benchmark's package name (AnTuTu,
# Ludashi), for phones that run benchmarks at full clock (tools/build_apk.sh: PACKAGE).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-33" > /dev/null
      - name: Third-party sources
        run: bash tools/setup.sh
      - name: Runtime compute shaders
        run: bash tools/shaders.sh
      - name: FFmpeg cache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg-android
          key: ffmpeg-android-${{ hashFiles('tools/build_ffmpeg.sh') }}
      - name: FFmpeg (video fallback)
        run: bash tools/build_ffmpeg.sh
      - name: Build signed APK
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_KS_PASS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Missing the RELEASE_KEYSTORE_B64 / RELEASE_KS_PASS repository secrets" >&2
            exit 1
          fi
          export RELEASE=1 KEYSTORE="$RUNNER_TEMP/release.jks" KEY_ALIAS=recomp
          APK_OUT="build/mhriseport-${GITHUB_REF_NAME}.apk" bash tools/build_apk.sh
          APK_OUT="build/mhriseport-${GITHUB_REF_NAME}-antutu.apk" PACKAGE=com.antutu.ABenchMark \
            LABEL="God Eater 3 Recomp (AnTuTu)" bash tools/build_apk.sh
          APK_OUT="build/mhriseport-${GITHUB_REF_NAME}-ludashi.apk" PACKAGE=com.ludashi.benchmark \
            LABEL="God Eater 3 Recomp (Ludashi)" bash tools/build_apk.sh
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "God Eater 3 Recomp $GITHUB_REF_NAME" \
              --notes "Install the APK, then follow the README: you need your own extracted game files."
          gh release upload "$GITHUB_REF_NAME" build/mhriseport-"${GITHUB_REF_NAME}"*.apk --clobber
